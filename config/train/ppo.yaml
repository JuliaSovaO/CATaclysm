# Гіперпараметри IPPO із parameter sharing (одна політика на всіх роботів)
algo: ippo_shared
seeds: [0, 1, 2]
total_agent_steps: 2000000
n_envs: 8
rollout_steps: 256
gamma: 0.99
gae_lambda: 0.95
lr: 3.0e-4
clip: 0.2
epochs: 10
minibatch: 512
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
frame_stack: 4
net:
  type: mlp
  hidden: [64, 64]
  activation: tanh
eval_every: 100000
eval_episodes: 50
checkpoint_dir: models/
curriculum: [L0, L1, L2]   # ступені навчання, кроки діляться порівну
target_kl: 0.05            # ранній вихід з епох, якщо політика змінилась занадто сильно
eval_deterministic: false  # валідація семплує дії (як і ppo: у run_eval)
